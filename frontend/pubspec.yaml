name: monopol_musix_vault
description: "Private mobile and desktop client for Monopol Musix Vault"
publish_to: 'none'
version: 0.4.0+4

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  # 11.x requires Android API 37, which Flutter's current AGP template does not support yet.
  flutter_secure_storage: ^10.0.0
  http: ^1.6.0
  media_kit: ^1.2.6
  media_kit_libs_audio: ^1.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
