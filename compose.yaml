name: monopol-musix-vault

services:
  api:
    build:
      context: ./backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      AUTH_ACCESS_TOKEN_MINUTES: ${AUTH_ACCESS_TOKEN_MINUTES:-15}
      AUTH_REFRESH_TOKEN_DAYS: ${AUTH_REFRESH_TOKEN_DAYS:-30}
      AUTH_SECRET: ${AUTH_SECRET:?Set AUTH_SECRET in .env}
      DB_HOST: postgres
      DB_MAX_CONNECTIONS: ${DB_MAX_CONNECTIONS:-10}
      DB_NAME: ${POSTGRES_DB:-musix_vault}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      DB_PORT: 5432
      DB_SSL: "false"
      DB_USER: ${POSTGRES_USER:-musix_vault}
      HOST: 0.0.0.0
      LIBRARY_PATH: /music
      LOG_LEVEL: ${LOG_LEVEL:-info}
      NODE_ENV: production
      PORT: 3000
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    ports:
      - "${API_PORT:-3000}:3000"
    volumes:
      - type: bind
        source: /srv/monopol-musix-vault/music
        target: /music
        read_only: true
    networks:
      - backend
      - public

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-musix_vault}
      POSTGRES_USER: ${POSTGRES_USER:-musix_vault}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backend

volumes:
  postgres_data:

networks:
  backend:
    internal: true
  public:
