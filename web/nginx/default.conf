server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  resolver 127.0.0.11 valid=10s ipv6=off;

  location = /healthz {
    access_log off;
    add_header Content-Type text/plain;
    return 200 'ok';
  }

  location = /sw.js {
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    try_files $uri =404;
  }

  location ~ (^|/)\. {
    return 404;
  }

  location = /api/brain/sync {
    set $api_upstream api:3000;
    proxy_pass http://$api_upstream/brain/sync;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Authorization $http_authorization;
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_connect_timeout 3s;
    proxy_send_timeout 300s;
    proxy_read_timeout 300s;
    proxy_intercept_errors on;
    error_page 502 = @api_unavailable;
    error_page 504 = @api_timeout;
  }

  location /api/ {
    set $api_upstream api:3000;
    rewrite ^/api/(.*)$ /$1 break;
    proxy_pass http://$api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header Range $http_range;
    proxy_set_header If-Range $http_if_range;
    proxy_pass_header Accept-Ranges;
    proxy_pass_header Content-Range;
    proxy_pass_header Content-Length;
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_connect_timeout 3s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
    proxy_intercept_errors on;
    error_page 502 = @api_unavailable;
    error_page 504 = @api_timeout;
  }

  location @api_unavailable {
    default_type application/json;
    add_header Cache-Control "no-store" always;
    return 502 '{"error":"API temporarily unavailable","code":"API_UNAVAILABLE"}';
  }

  location @api_timeout {
    default_type application/json;
    add_header Cache-Control "no-store" always;
    return 504 '{"error":"API request timed out","code":"API_TIMEOUT"}';
  }

  location ~ ^/(spotify|soundcloud|applemusic|amazonmusic)/?$ {
    try_files /index.html =404;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header Permissions-Policy 'camera=(), microphone=(), geolocation=()' always;
}
